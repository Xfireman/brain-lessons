[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-lessons"
version = "0.3.0"
description = "Turn corrections into local project rules for your coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Brain Lessons contributors"}]
keywords = ["ai", "agents", "memory", "codex", "claude-code", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Xfireman/brain-lessons"
Issues = "https://github.com/Xfireman/brain-lessons/issues"

[project.scripts]
brain-lessons = "brain_lessons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_lessons = ["data/brain-remember/SKILL.md", "data/brain-remember/agents/openai.yaml", "data/brain-remember/gitignore"]
